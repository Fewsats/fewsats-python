[project]
name = "mcp-server-fewsats"
version = "0.0.1"
description = "A Model Context Protocol server providing tools to pay for and manage payments with Fewsats"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fewsats" }]
maintainers = [{ name = "Fewsats" }]
keywords = ["fewsats", "mcp", "llm", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "fewsats>=0.0.14",
    "mcp[cli]>=1.1.3",
]

[project.scripts]
mcp-server-fewsats = "mcp_server_fewsats:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3"]